    - "            &8&oBy JakisNieKot                              "
    - ""
    - " {fileHandlerStatus}               "
    - ""
    - "&8==============================================================================="
    - ""
  database:
    status:
      true: "&aONLINE"
      false: "&cOFFLINE"

      exitCodes:
#     1045 - Access Denied
#     1049 - NonExistent DB
#     0 - Timeout

        1045: "&4ACCESS DENIED"
        1049: "&4DB DOES NOT EXIST"
        0: "&4TIMED OUT"
        -1: "&4TIMED OUT"

      fatal: "&4FATAL ERROR"

    motd: "&#FF9B00Database: {status} &8| &7DatabaseName: &f{name} &8| &7User: &f{user} &8| &7Password: &f{password} &8| &7Port: &f{port}"

debugLog:
  machinePlaced: "&7Added machine with &f{locString} &7to the database!"
  machineRemoved: "&7Removed machine with &f{locString} &7from the database!"
  connectorPlaced: "&7Added connector with &f{locString} &7to the database!"
  connectorRemoved: "&7Removed connector with &f{locString} &7from the database!"
  wire:
    first: "&7Player &f{player} &7started a wire connection at &f{locString}&7!"
    success: "&7Player &f{player} &7finished his wire connection!"
    cancel: "&7Player &f{player} &7canceled his wire connection!"

wire:
  actionbar:
    #{wireDisplayName}
    main: "&7Wire Installation&8 - &e{distance}&fm&7/&e{max_distance}&fm &8&l| &cShift click to cancel"
    success: "&aWire successfully installed"
    cancel: "&cWire installation cancelled"
    error:
      cannotConnectToItself: "&cWire cannot connect to itself"
      tooFar: "&cExceeded wire range limit"
      connectorHasTooManyConnections: "&cThis wire connector has no more space left"
      alreadyConnected: "&cThis connection is already established"

errors:
  noPAPI: "&ePlaceholderAPI has not been registered on the server, some features might not work!"
  database:
    noConnection: "&7Database isnt connected properly, &caborting action"

  items:


    noSuchItem: "&cItem {ID} isnt registered properly / doesnt exist!"
    noMaterial: "&cItem {ID} does not have its material set! Forcing material to STONE"
    nonExistentMaterial: "&cItem {ID} has a non-existent material set! Forcing material to STONE"
    noPowerItemType: "&cItem {ID} doesnt have its PowerItemType set! Add powerItemType: NONE if this shouldve happened"


utilItems:
  multimeter:
    notAnEnergyBlock: "&cThis block does not contain energy"
    success: "&7Energy: &e{energy}&fW&8/&e{maxEnergy}&fW &8| &aInput: &e{input}&fW &8| &cOutput: &e{output}&fW"
  connectorWrench:
    push: "&7Connector: &aPUSH"
    pull: "&7Connector: &cPULL"
    static: "&7Connector: &eSTATIC"

command:
  recipe:
    print:
      main:
      - ""
      - "&6&l{recipeID}&7: "
      - ""
      - "&7Inputs:"
      - "{INPUTS}"
      - "&7Outputs:"
      - "{OUTPUTS}"
      - "&7Energy usage: &f{energyUsage}%pg_energy_symbol%"
      - "&7Process time: &f{processTime}&et"
      - "&7Machines:"
      - "{MACHINES}"
      item: " &8- &e{amount}&fx {name}"
      machine: "&8- &e{machine}"

  getSerializedItem:
    success: "&7Skopiuj &9{item} &7jako StringList"
    noItem: "&cYou need to hold an item in your hand to use this command"

parsing:

  start:
    - "&8=============================================="
    - "             &a&lPARSING STARTED"
    - "&8=============================================="
  finish:
    - ""
    - "&8=============================================="
    - "             &c&lPARSING FINISHED"
    - "&8=============================================="
    - ""

  level:
    severe: "&c[SEVERE] &r"
    warning: "&e[WARNING] &r"
    info: "&a[INFO] &r"
    none: ""


  item:
    separator:
      - ""
      - "&8--------------------------------------"
      - "&3&lITEMS"
      - "&8--------------------------------------"

    success: "&3Item &8- &f{ID}&7 &7has been registered &asuccessfully!"

    nullMaterial: "&3Item &8- &f{ID}&7's material is &cnull&7, &cforcing &6STONE&7..."
    powerItemTypeError: "&3Item &8- &f{ID}&7's powerItemType is &cnull, &cforcing &6NONE&7..."
    itemNameError: "&3Item &8- &f{ID}&7's itemName is &cnull"


    fatal: "&3Item &8- &f{ID}&7 encountered an &cfatal error!"

  recipe:
    separator:
      - ""
      - "&8--------------------------------------"
      - "&e&lRECIPES"
      - "&8--------------------------------------"

    success: "&eRecipe &8- &f{ID}&7 has been registered &asuccessfully!"

    noProcessTime: "&eRecipe &8- &f{ID}&7 has &cno process time set! &7Forcing &620t&7..."
    inputItemsError: "&eRecipe &8- &f{ID}&7 has its input section &cfaulty registered! &cSkipping..."
    outputItemsError: "&eRecipe &8- &f{ID}&7 has its output section &cfaulty registered! &cSkipping..."
    dupedRecipeName: "&eRecipe &8- &f{ID}&7's recipe name is &eduped! &cSkipping..."

    fatal:
      defaultsNotLoaded: "&eRecipe &cCould not load the default recipes!"
      folderError: "&eRecipe &cRecipe folder couldnt be detected!"

  sound:
    separator:
      - ""
      - "&8--------------------------------------"
      - "&d&lSOUNDS"
      - "&8--------------------------------------"

    success: "&dSound &8- &f{ID}&7 has been registered &asuccessfully!"

    noPitchSet: "&dSound &8- &f{ID}&7's pitch is &cnull! &7Forcing &61.0f&7..."
    noVolumeSet: "&dSound &8- &f{ID}&7's volume is &cnull! &7Forcing &61.0f&7..."
    noSoundCategory: "&dSound &8- &f{ID}&7's category is &cnull! &7Forcing &6MASTER&7..."
    noPlayType: "&dSound &8- &f{ID}&7's playType is &cnull! &7Forcing &6WORLD&7..."

    fatal:
      noSoundType: "&dSound &8- &f{ID}&7's sound type is &cnull! &7Skipping..."

  machine:
    separator:
      - ""
      - "&8--------------------------------------"
      - "&5&lMACHINES"
      - "&8--------------------------------------"

    success: "&5Machine &8- &f{ID}&7 has been registered &asuccessfully!"
    noInputs: "&5Machine &8- &f{ID}&7 does not have any input slots"
    noOutputs: "&5Machine &8- &f{ID}&7 does not have any output slots"
    noMaxEnergy: "&5Machine &8- &f{ID}&7's maxEnergy is &cnull"
    customEnergyAmount: "&5Machine &8- &f{ID}&7 has a custom &eenergy &7base set"
    noMaxInputTransfer: "&5Machine &8- &f{ID}&7's maxInputTransfer is &cnull"
    noMaxOutputTransfer: "&5Machine &8- &f{ID}&7's maxOutputTransfer is &cnull"
    noItemSlotType: "&5Machine &8- &f{ID}&7's itemStorage has a &climbo-state &7slot! &7Forcing &6INPUT&7..."
    noSection: "&5Machine &8- &f{ID}&7`s itemStorage is &cnull!"

    fatal:
      itemSlotDupedID: "&5Machine &8- &f{ID}&7`s slots have their ID &cduped! &7Skipping..."

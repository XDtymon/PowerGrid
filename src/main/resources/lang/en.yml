  startup:
    - ""
    - "&8==============================================================================="
    - "                                                                        "
    - '&#FF9B00&l     ___   ___  __      __ ___  ___   ___  ___  ___  ___    '
    - '&#E58608&l    | _ \ / _ \ \ \    / /| __|| _ \ / __|| _ \|_ _||   \   '

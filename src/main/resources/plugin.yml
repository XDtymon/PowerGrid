name: PowerGrid
prefix: PowerGrid
version: '${version}'

main: com.jakisniekot.powerGrid.MainPlugin
api-version: '26.2'
load: POSTWORLD

authors: [ JakisNieKot ]
permissions:
  powergrid.admin:
    default: op
    children:
      - powergrid.place.connector
      - powergrid.place.wire
      - powergrid.place.relay
      - powergrid.command.give
  powergrid.place.connector:
    default: false
  powergrid.place.wire:
    default: false
  powergrid.place.relay:
    default: false
  powergrid.command.give:
    default: false
commands:
  powergrid:
    aliases:
      - pg
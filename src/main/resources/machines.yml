#
# Machines config
#

# ID
pulverizer:
  # ITEM FOR MACHINE
  item: pulverizer_machine
  # ENERGY STACK
  energyStorage:
    # If you want the machine to
    # contain some amount of energy
    # change the value of "energy"
    energy: 0
    # Maximal energy storage
    maximumEnergy: 3000
    # Maximal input transfer
    maxInputTransfer: 40
    # Maximal output transfer
    maxOutputTransfer: 0

  # ITEM SLOTS
  itemStorage:
    #   SLOT_IDS
    itemInput:
      # slotIDs range from 1 to 54
      slotID: 10
      # itemSlotTypes:
      # INPUT
      # OUTPUT
      itemSlotType: INPUT
    catalizator:
      slotID: 11
      itemSlotType: INPUT
    itemOutput1:
      slotID: 33
      itemSlotType: OUTPUT
    itemOutput2:
      slotID: 34
      itemSlotType: OUTPUT
    itemOutput3:
      slotID: 35
      itemSlotType: OUTPUT
    itemOutput4:
      slotID: 36
      itemSlotType: OUTPUT
      # MULTIBLOCK STRUCTURE
      #multiblock: copper_furnace_structure

